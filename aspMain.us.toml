# RSPRecomp config for South Park's audio microcode (libultra aspMain).
#
# The text is byte-identical to Turok 2's (ROM 0xBF520 there), so the command
# dispatch targets are the same; the table itself sits in the ROM at 0xBC4B8.
#
#   external/N64Recomp/build/RSPRecomp aspMain.us.toml
text_offset = 0xBAE78
text_size = 0xEE0
text_address = 0x04001080
rom_file_path = "rom/southpark.us.z64"
output_file_path = "rsp/aspMain.cpp"
output_function_name = "aspMain"
extra_indirect_branch_targets = [
    # audio command dispatch table
    0x1118, 0x1470, 0x11DC, 0x1B38, 0x1214, 0x187C, 0x1254, 0x12D0,
    0x12EC, 0x1328, 0x140C, 0x1294, 0x1E24, 0x138C, 0x170C, 0x144C,
]
