# N64Recomp config for South Park (USA).
#
# Run from the repository root:
#   external/N64Recomp/build/N64Recomp southpark.us.toml

[input]
# The cartridge entry point (0x80000400) is the SN64 boot stub. It only clears
# BSS and programs the TLB, so it is not recompiled: the runtime sets the stack
# and calls game_main itself (src/game/boot.cpp, docs/LAYOUT.md).
symbols_file_path = "symbols/southpark.us.syms.toml"
rom_file_path = "rom/southpark.us.z64"
output_func_path = "RecompiledFuncs"

[patches]
# Replaced by native code in src/game/boot.cpp.
ignored = [
    # Reloads the first 1 MiB of the cartridge through raw PI registers and
    # clears BSS before calling osInitialize and game_main.
    "game_entry",
    # The engine's VM pager.
    "VM_Initialize",
    "VM_Alloc",
    # libultra's osVirtualToPhysical under another name (see symbols/manual_names).
    "sp_osVirtualToPhysical",
    # libultra's osPiRawStartDma: the engine drives the cartridge itself.
    "sp_osPiRawStartDma",
    # libultra's osAiGetStatus and osAiSetNextBuffer: the audio thread needs a
    # real "FIFO full" answer (src/game/audio.cpp).
    "sp_osAiGetStatus",
    "sp_osAiSetNextBuffer",
    "sp_osAiSetFrequency",
    # libultra's osViSetMode and osViSwapBuffer: RT64 needs the video origin one
    # row into the framebuffer (src/game/video.cpp).
    "sp_osViSetMode",
    "sp_osViSwapBuffer",
]

# Hand-written assembly N64Recomp cannot translate: coprocessor 0, TLB and
# cache instructions. Each one was identified against the same code in Turok 2
# (turok2-decomp docs/ASM_ORIGIN.md). Stubbed = compiled as an empty function.
stubs = [
    # Boot: tail of the TLB writer. Never called: boot is done natively.
    "boot_STVM_MapTLB_tail",
    # Engine VM pager's TLB access. The pager is replaced by native code that
    # keeps the paged module resident, so there is no TLB to program.
    "STVM_MapTLB",
    "STVM_UnmapTLB",
    "STVM_DumpTLB",
    "__osUnmapTLBAll",
    # libultra exception handler. Threads and interrupts are done by the runtime.
    # (Its helper send_mesg needs no entry: N64Recomp ignores it by name.)
    "__osException_handler",
    # Debug only: watch registers and the SN64 debugger / crash-dump stub.
    "Debug_SetWatch",
    "SNDebug_SetErrorEPC_0",
    "SNDebug_SetErrorEPC_1",
    "SNDebug_InvalICache",
    "SNDebug_InvalDCache",
    "SNDebug_DumpTLB",
    "SNDebug_Handler",
    "SNDebug_SaveContext",
]

# View_DrawBorder paints a black two-pixel frame around every view, in single
# player around the whole screen. On a TV that hid the ragged picture edge; in
# a widescreen window it shows as two vertical lines where the 4:3 picture
# ends. The hook leaves the function early for a view that fills the screen and
# keeps the frame between split-screen views (src/game/video.cpp).
[[patches.hook]]
func = "View_DrawBorder"
before_vram = 0x0025E124
text = "{ extern int sp_skip_view_border(uint8_t* rdram, recomp_context* ctx); if (sp_skip_view_border(rdram, ctx)) return; }"

# Modern controls (src/game/controls.cpp). The first hook sits right after the
# raw controller state has been fetched, the second right after the player's
# input structure has been filled in (func_0022BDA0, Turok 2's CPlayer__ReadInput).
[[patches.hook]]
func = "Controller_ReadPads"
before_vram = 0x0022C27C
text = "{ extern void sp_controls_after_pad_read(uint8_t* rdram, recomp_context* ctx); sp_controls_after_pad_read(rdram, ctx); }"

[[patches.hook]]
func = "CPlayerList__Update"
before_vram = 0x002357FC
text = "{ extern void sp_controls_after_read_input(uint8_t* rdram, recomp_context* ctx); sp_controls_after_read_input(rdram, ctx); }"

[[patches.hook]]
func = "CPlayer__ApplyWalkInput"
before_vram = 0x00231D50
text = "{ extern void sp_controls_walk_table(uint8_t* rdram, recomp_context* ctx); sp_controls_walk_table(rdram, ctx); }"

